# Слой плагина: строки, которые он вставляет в профиль при установке как bundle.
#
# МАШИННЫХ ПУТЕЙ ЗДЕСЬ НЕТ И БЫТЬ НЕ ДОЛЖНО: этот файл уезжает в общий репозиторий вместе с
# пакетом. Путь к голосовому процессу берётся из самого пакета (папка `runtime` рядом), а питон
# из окружения `DSH_VOICE_PYTHON` или из `python` в PATH. Если нужен свой питон, задайте его
# переменной окружения или допишите `pythonPath` в свою строку загрузчика: собственный слой
# профиля применяется ПОСЛЕ слоёв плагинов и потому перекрывает их.
- insert:
    - id: voice-stream
      name: '@local/dsh-voice-stream'
      config:
        # Первый кусок короткий, чтобы звук пошёл почти сразу, дальше куски растут.
        firstChunk: 50
        chunkChars: 260
        maxChars: 6000
        fillers: true
