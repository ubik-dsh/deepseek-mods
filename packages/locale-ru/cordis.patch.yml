# Слой плагина-руссификатора: строка, которая включает русский язык в панели.
#
# Настроек здесь нет: руссификатору нечего настраивать, он просто регистрирует словари.
# Машинных путей быть не должно: файл уезжает в общий репозиторий вместе с пакетом.
- insert:
    - id: locale-ru
      name: '@local/dsh-locale-ru'
